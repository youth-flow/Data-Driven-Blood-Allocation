name: Synthetic tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/check_git_privacy.py --all-tracked
      - run: python scripts/check_git_privacy.py --history HEAD
      - run: python -m ruff check src tests DAT SAA wSAA Flat-ETO Set-ETO scripts data/数据预处理.py
      - run: python -m ruff format --check src tests DAT SAA wSAA Flat-ETO Set-ETO scripts data/数据预处理.py
      - run: python -m pytest
