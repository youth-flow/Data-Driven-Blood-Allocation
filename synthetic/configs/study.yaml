# Study protocol, not a model/generator configuration and not an automatic sweep launcher.
schema_version: 1
training_mode: direct_daily_end_to_end
main:
  scenarios: [S1, S2, S3, S4]
  n_train: 2000
  n_validation: 500
  n_test: 3000
  refit_with_validation: true
  final_fit_days: 2500
learning_curve:
  scenarios: [S2, S3]
  n_train: [500, 1000, 2000, 5000]
  n_validation: 500
  n_test: 3000
  final_fit_days: [1000, 1500, 2500, 5500]
  identical_validation_and_test_within_data_seed: true
  nested_training_samples: true
replications:
  data_seeds: [20261102, 20261103, 20261104, 20261105, 20261106, 20261107, 20261108, 20261109, 20261110, 20261111]
  model_seeds: [0, 1, 2]
  average_model_seeds_within_data_replication_first: true
evaluation:
  primary: P_vs_training_SAA
  taus: [0.5, 0.6, 0.7, 0.8, 0.9, 0.95]
  targets: [260, 280, 300, 320, 340]
  compare_methods_on_same_test_days: true
  never_select_configuration_on_test_results: true
