schema_version: 2
seed: 42
taus: [0.9]
targets: [260, 280, 300, 320, 340]
method: DAT
data_root: ../../data/processed
output_root: ../../outputs
training:
  epochs: 120
  batch_size: 64
  learning_rate: 0.002
  weight_decay: 0.0
  patience: 30
  gradient_clip: 1.0
  device: auto
  threads: 4
model:
  d_model: 80
  layer_norm_eps: 0.00001
  context: {include_inventory: true}
  patient_encoder: {hidden_dims: [96], activation: relu, dropout: 0.0}
  self_attention: {num_layers: 1, num_heads: 4, dropout: 0.0}
  day_encoder: {hidden_dims: [], activation: relu, dropout: 0.0}
  cross_attention: {num_layers: 1, num_heads: 4, ff_dim: 128, dropout: 0.0}
  head: {hidden_dims: [], output_lower_bound: 0.0, output_upper_bound: 60.5}
loss:
  type: pinball
  taus: [0.9]
constraints:
  enabled: true
  projection_interval: 1
  global_parameter_radius: 100.0
  operator_norm_bound: 100.0
  bias_bound: 100.0
  layer_norm_gain_bound: 100.0
  layer_norm_shift_bound: 100.0
